# YOLO26 OBB with MobileNetV4-small backbone and DWConv downsampling in the neck
nc: 3
end2end: True
reg_max: 1

backbone:
  - [-1, 1, MobileNetV4Backbone, [small, [32, 64, 96, 128]]]
  - [0, 1, Index, [64, 1]]
  - [0, 1, Index, [96, 2]]
  - [0, 1, Index, [128, 3]]

head:
  - [3, 1, SPPF, [128, 5, 3, True]]
  - [-1, 1, C2PSA, [128]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, C3k2, [96, True]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 1, C3k2, [64, True]]
  - [-1, 1, DWConv, [96, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [96, True]]
  - [-1, 1, DWConv, [128, 3, 2]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, True]]
  - [[11, 14, 17], 1, OBB26, [nc, 1]]
